# Conda env baked into the Lambda container image (both poller + alerter).
# eccodes/cfgrib come from conda-forge (the C library is painful via pip) —
# same rationale as the repo's top-level environment.yml.
name: base
channels:
  - conda-forge
dependencies:
  - python=3.11
  - eccodes
  - cfgrib
  - h5py
  - xarray
  - numpy
  - pandas
  - pyarrow
  - s3fs
  - matplotlib-base
  - requests
  - boto3
  - pyyaml
  # The daily summary resolves "America/New_York" to pick its window. The IANA
  # database arrives transitively today (pandas -> pytz), but a summary that
  # silently shifts an hour — or throws at 06:00 — because a transitive dep
  # moved is not a dependency worth leaving implicit.
  - tzdata
  - pip
